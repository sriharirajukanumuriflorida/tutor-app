<div class="tutor-container">
  <div class="avatar" [class.listening]="state === 'listening'" [class.speaking]="state === 'speaking'">
    <img src="/assets/aria.jpeg" alt="Aria" class="avatar-image">
  </div>

  <div class="display-area">
    <div class="display-text">{{ displayText }}</div>
    <div class="user-text" *ngIf="userText">You said: {{ userText }}</div>
  </div>

  <div class="subject-pills" *ngIf="!subject">
    <button class="pill math-pill" (click)="selectSubject('math')">
      🧮 Math
    </button>
    <button class="pill english-pill" (click)="selectSubject('english')">
      📚 English
    </button>
  </div>

  <div class="subject-display" *ngIf="subject">
    <div class="selected-subject">Learning: {{ subject }}</div>
  </div>

  <button class="mic-button"
          [class.active]="state === 'listening'"
          (click)="onMicClick()"
          [disabled]="state === 'thinking' || state === 'speaking'">
    <span class="mic-icon">{{ state === 'listening' && !speechSupported ? '⏹️' : '🎤' }}</span>
  </button>

  <div class="text-fallback">
    <input
      type="text"
      [(ngModel)]="typedText"
      (keyup.enter)="submitTyped()"
      placeholder="Or type here..."
      [disabled]="state !== 'idle'"
      aria-label="Type your answer">
    <button (click)="submitTyped()" [disabled]="state !== 'idle' || !typedText.trim()">Send</button>
  </div>

  <div class="error-detail" *ngIf="errorDetail" (click)="errorDetail = ''">{{ errorDetail }} (tap to dismiss)</div>

  <div class="status-bar">
    <span class="status" [ngSwitch]="state">
      <span *ngSwitchCase="'listening'">Listening...</span>
      <span *ngSwitchCase="'thinking'">Processing...</span>
      <span *ngSwitchCase="'speaking'">Speaking...</span>
      <span *ngSwitchDefault>Ready to talk</span>
    </span>
  </div>
</div>
